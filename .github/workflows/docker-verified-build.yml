# Docker reproducible build of the protocol v1 escrow program, from the last commit of this repository that holds v1.
#
# Since the upgrade of 2026-11-10 (transaction
# 3X996yrTdNsXpUYgbSUozwHCzND4Xefxh5zhuZjueTQ5DzoNBaovqERkQ9jviqwz8aPsQnAxYvm1aMGHU7iYKpER, finalized slot 467605377) the
# live program is v2 and is checked by .github/workflows/v2-docker-verified-build.yml. This workflow keeps the v1 build
# checkable: it checks out commit V1_COMMIT below (program/ tree 75f75111..., the source of the bytes that were live from
# 2026-11-08 to 2026-11-10), builds it twice in two separate jobs on two separate runners inside the same digest-pinned
# Docker image (program/ mounted at /build), and fails unless both builds are byte-identical and equal the fixed v1 sha256.
# The v1 bytes matter after the upgrade because they are the rollback target: a rollback buffer holding them stays open
# during an observation period. The compare job reads that buffer read-only and prints "ROLLBACK BUFFER MATCH" when its
# program bytes equal the v1 build. If the buffer is closed (the plan once the observation period ends) the comparison is
# skipped with a notice; if it was read and differs, the run fails.
# Before 2026-11-10 this workflow built the checked-out commit and compared it with the live program; its run 42521490252
# printed FULL MATCH for v1 (see docs/VERIFY_BUILD.md).
# What it does and does not do: it holds no key, signs nothing and sends no transaction (no buffer, no upgrade, no on-chain
# write). It does write files on the runners (build output, build.json, hashes.json, a read-only dump of the buffer) and
# uploads them as workflow artifacts.
# What it proves: the two jobs, sharing the same pinned image and toolchain, produce identical bytes (repeatability). It does
# not prove compiler correctness or independence from that toolchain. Remaining trust inputs: the published image, apt
# packages on the runner (unpinned, used only to compile solana-verify), crates.io downloads at build time (checked against
# the Cargo.lock checksums) and network access during the build.
name: docker-verified-build
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PROGRAM_ID: 7nu5ZGNAu8LbRFR5iSyAtNxRGyGqjtQ8Z9qzFqemZKuS
  LIBRARY_NAME: xmr_sol_swap
  # The last commit of this repository whose program/ is v1 (program/ tree 75f75111781c25b612a0ac04408cb8ae8383fc07).
  V1_COMMIT: b33cc3eb33f3ad7d09c44f3121db356db2561568
  V1_PROGRAM_TREE: 75f75111781c25b612a0ac04408cb8ae8383fc07
  # Expected sha256 of the exact 215,944 v1 program bytes (live 2026-11-08 to 2026-11-10, now the rollback target).
  LIVE_SHA256: 4033eb70a5d4d6f7d47654d278a54633bafd5366303b7882a17032d4cbbc3515
  LIVE_SIZE: "215944"
  # Rollback buffer written on 2026-11-10 with the v1 Docker bytes, kept open during the observation period.
  ROLLBACK_BUFFER: D5aHjv8SVQNyoJmAySxQYKPv93HTFE2rZ4scanwcJJia
  # Live bytes before 2026-11-08 (information only, not checked).
  PREVIOUS_LIVE_SHA256: 76424c24aa28d5f74e52781df0a98d95e43003ad2374c48f47acd1c21045599d
  # solana-verify 0.5.2, pinned by the sha256 of its crates.io .crate file (measured 8 Nov 2026) and built with --locked.
  SOLANA_VERIFY_VERSION: "0.5.2"
  SOLANA_VERIFY_CRATE_SHA256: 100996e26394122ef5358ec756f76ea1b41aab8dd959de8b10091b5017329a7c
  # solanafoundation/solana-verifiable-build:4.3.0 (single-arch linux/amd64 manifest), pinned by digest. This is the same
  # digest that solana-verify 0.5.2 maps to Solana 4.3.0 in its own image table. Image contents (from its config history):
  # rust 1.97.1 base, label agave.version=v4.3.0, cargo-build-sbf 4.3.0 installed with --locked, platform-tools v1.57
  # preinstalled, WORKDIR /build. cargo-build-sbf 4.3.0 defaults to platform-tools v1.57 and arch v0, matching the live build.
  BASE_IMAGE: solanafoundation/solana-verifiable-build@sha256:12fd4c0a0790f0fc41ef74b0cdb6bccc167ba6137eb1adb749bac649481c86bd
jobs:
  build:
    name: docker build ${{ matrix.run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        run: [a, b]
    steps:
      # actions/checkout v4.2.2, pinned to its commit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.V1_COMMIT }}
          persist-credentials: false
      - name: Record and check the source identity
        run: |
          echo "commit: $(git rev-parse HEAD)"
          echo "program tree: $(git rev-parse HEAD:program)"
          [ "$(git rev-parse HEAD)" = "$V1_COMMIT" ] || { echo "::error::checked-out commit is not V1_COMMIT"; exit 1; }
          [ "$(git rev-parse HEAD:program)" = "$V1_PROGRAM_TREE" ] || { echo "::error::program/ tree is not the v1 tree"; exit 1; }
          sha256sum program/Cargo.toml program/Cargo.lock program/src/lib.rs
      - name: Install the pinned solana-verify (crate hash checked, --locked)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libudev-dev libssl-dev >/dev/null
          curl -sSfL "https://static.crates.io/crates/solana-verify/solana-verify-${SOLANA_VERIFY_VERSION}.crate" -o /tmp/sv.crate
          got=$(sha256sum /tmp/sv.crate | cut -d' ' -f1); echo "solana-verify crate sha256: $got"
          [ "$got" = "$SOLANA_VERIFY_CRATE_SHA256" ] || { echo "::error::solana-verify crate hash differs from the pin"; exit 1; }
          mkdir -p /tmp/sv && tar xzf /tmp/sv.crate -C /tmp/sv
          cargo install --locked --path "/tmp/sv/solana-verify-${SOLANA_VERIFY_VERSION}" --root "$HOME/sv"
          echo "$HOME/sv/bin" >> "$GITHUB_PATH"
      - name: Pull the digest-pinned build image
        run: |
          docker pull "$BASE_IMAGE"
          docker image inspect "$BASE_IMAGE" --format 'image id {{.Id}} repo digests {{.RepoDigests}} arch {{.Architecture}}'
          docker run --rm "$BASE_IMAGE" sh -c 'pwd; cargo-build-sbf --version'
      - name: solana-verify build (mount program/ at /build)
        run: |
          solana-verify --version
          solana-verify build "$GITHUB_WORKSPACE/program" --library-name "$LIBRARY_NAME" --base-image "$BASE_IMAGE"
      - name: Hash the build output
        run: |
          so="program/target/deploy/${LIBRARY_NAME}.so"
          ls -l "$so"
          mkdir -p out && cp "$so" "out/${LIBRARY_NAME}.so"
          size=$(wc -c < "out/${LIBRARY_NAME}.so" | tr -d ' ')
          sha=$(sha256sum "out/${LIBRARY_NAME}.so" | cut -d' ' -f1)
          svh=$(solana-verify get-executable-hash "out/${LIBRARY_NAME}.so" | tail -1)
          echo "run ${{ matrix.run }}: $size bytes, sha256 $sha, solana-verify executable hash $svh"
          printf '{"run":"%s","runner":"%s","size":%s,"sha256":"%s","solana_verify_executable_hash":"%s"}\n' \
            "${{ matrix.run }}" "$RUNNER_NAME" "$size" "$sha" "$svh" > out/build.json
          cat out/build.json
      - name: Upload this build
        # actions/upload-artifact v4.6.2, pinned to its commit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-${{ matrix.run }}
          path: out/
          if-no-files-found: error
  compare:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # actions/checkout v4.2.2, pinned to its commit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.V1_COMMIT }}
          persist-credentials: false
      # actions/download-artifact v4.3.0, pinned to its commit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: builds
      - name: Dump the rollback buffer read-only (public RPC)
        continue-on-error: true
        run: |
          set +e
          for i in 1 2 3 4 5; do
            curl -sS -X POST https://api.mainnet-beta.solana.com -H 'Content-Type: application/json' \
              -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getAccountInfo\",\"params\":[\"$ROLLBACK_BUFFER\",{\"encoding\":\"base64\"}]}" > buf.json
            jq -e '.result' buf.json >/dev/null && break
            sleep $((i * 10))
          done
          if [ "$(jq -r '.result.value // "null"' buf.json)" = "null" ]; then echo closed > buffer-state.txt; echo "rollback buffer $ROLLBACK_BUFFER: no account (closed)"; exit 0; fi
          jq -r '.result.value.data[0] // empty' buf.json | base64 -d > buf.bin
          # Buffer layout: 4-byte enum tag, 1-byte option tag, 32-byte authority = 37-byte header.
          tail -c +38 buf.bin > buf-full.so
          head -c "$LIVE_SIZE" buf-full.so > buf.so
          echo "rollback buffer (leading $LIVE_SIZE program bytes) sha256: $(sha256sum buf.so | cut -d' ' -f1)"
          full=$(wc -c < buf-full.so | tr -d ' '); extra=$((full - LIVE_SIZE)); echo "program bytes in the buffer: $full"
          if [ "$extra" -gt 0 ]; then tail -c "$extra" buf-full.so | tr -d '\000' | wc -c | tr -d ' ' > buf-tail-nonzero.txt; else echo 0 > buf-tail-nonzero.txt; fi
          echo open > buffer-state.txt
      - name: Compare the two builds (determinism) and write hashes.json
        run: |
          a="builds/build-a/${LIBRARY_NAME}.so"; b="builds/build-b/${LIBRARY_NAME}.so"
          sa=$(sha256sum "$a" | cut -d' ' -f1); sb=$(sha256sum "$b" | cut -d' ' -f1)
          za=$(wc -c < "$a" | tr -d ' '); zb=$(wc -c < "$b" | tr -d ' ')
          echo "build a: $za bytes, sha256 $sa"
          echo "build b: $zb bytes, sha256 $sb"
          deterministic=false; cmp -s "$a" "$b" && deterministic=true
          state=$(cat buffer-state.txt 2>/dev/null || echo "not read")
          buf_sha=""; buf_equal=false; buf_result="not checked ($state)"
          tail_nonzero=$(cat buf-tail-nonzero.txt 2>/dev/null || echo 0)
          if [ "$state" = open ] && [ -s buf.so ]; then
            buf_sha=$(sha256sum buf.so | cut -d' ' -f1)
            if [ "$buf_sha" = "$sa" ] && [ "$tail_nonzero" = 0 ]; then buf_equal=true; buf_result="ROLLBACK BUFFER MATCH"; else buf_result="MISMATCH"; fi
          fi
          jq -n --arg commit "$(git rev-parse HEAD)" --arg tree "$(git rev-parse HEAD:program)" \
            --arg image "$BASE_IMAGE" --arg sv "$SOLANA_VERIFY_VERSION" --arg pid "$PROGRAM_ID" \
            --slurpfile ja builds/build-a/build.json --slurpfile jb builds/build-b/build.json \
            --argjson det "$deterministic" --arg v1_expected "$LIVE_SHA256" --arg previous_live "$PREVIOUS_LIVE_SHA256" \
            --arg buffer "$ROLLBACK_BUFFER" --arg buf_sha "$buf_sha" --argjson buf_equal "$buf_equal" --arg buf_result "$buf_result" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{program_id:$pid, commit:$commit, program_tree:$tree, mount_path:"program", container_path:"/build",
              base_image:$image, solana_verify:$sv, builds:[$ja[0],$jb[0]], deterministic:$det,
              v1_expected_sha256:$v1_expected, previous_live_sha256:$previous_live,
              rollback_buffer:$buffer, rollback_buffer_sha256:$buf_sha, docker_build_equals_rollback_buffer:$buf_equal,
              rollback_buffer_result:$buf_result, run_url:$run_url}' > hashes.json
          cat hashes.json
          mkdir -p final && cp "$a" "final/${LIBRARY_NAME}.so" && cp hashes.json final/
          [ "$deterministic" = true ] || { echo "::error::NOT DETERMINISTIC: the two Docker builds differ"; exit 1; }
          echo "DETERMINISTIC: both Docker builds are byte-identical (sha256 $sa)"
          [ "$za" = "$LIVE_SIZE" ] && [ "$sa" = "$LIVE_SHA256" ] || { echo "::error::the build ($za bytes, $sa) differs from the expected $LIVE_SIZE bytes, $LIVE_SHA256"; exit 1; }
          echo "EXPECTED: the v1 build equals the fixed expected value ($LIVE_SIZE bytes, sha256 $LIVE_SHA256)"
          case "$buf_result" in
            "ROLLBACK BUFFER MATCH") echo "ROLLBACK BUFFER MATCH: the program bytes in $ROLLBACK_BUFFER (leading $LIVE_SIZE, nothing but zeros after them) equal the v1 Docker build";;
            MISMATCH) echo "::error::MISMATCH: the rollback buffer (sha256 $buf_sha, $tail_nonzero non-zero bytes after the program) differs from the v1 Docker build"; exit 1;;
            *) echo "::notice::the rollback buffer was not compared ($state)";;
          esac
      - name: Upload the verified-build .so and hashes.json
        # actions/upload-artifact v4.6.2, pinned to its commit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docker-verified-build
          path: final/
          if-no-files-found: error

[package]
name="silo-zec-native-readonly"
version="0.1.0"
edition="2021"
publish=false
[dependencies]
silo-zec-core={path=".."}
zcash_client_backend={version="=0.25.0-pre.1",default-features=false}
zcash_protocol="=0.11.0-pre.0"
tonic={version="0.14",features=["transport","tls-ring","tls-webpki-roots"]}
tokio={version="1",features=["macros","rt-multi-thread"]}
serde_json="1"
bip0039="0.12"
rand={version="0.10",features=["sys_rng"]}
prost="0.14"
[workspace]

[patch.crates-io]
schemerz-rusqlite={path="../vendor/schemerz-rusqlite"}

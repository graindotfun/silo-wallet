[package]
name = "zec-fixture-chain"
version = "0.0.0"
edition = "2021"
publish = false
[dependencies]
zcash_client_backend = { version = "=0.24.0", default-features = false, features = ["orchard", "test-dependencies"] }
zcash_keys = { version = "=0.16.1", features = ["orchard", "sapling"] }
zcash_protocol = "=0.10.6"
zcash_primitives = "=0.30.1"
orchard = "0.15"
sapling = { package = "sapling-crypto", version = "0.7" }
incrementalmerkletree = { version = "0.8", features = ["legacy-api"] }
zip32 = "0.2"
bip0039 = "0.12"
prost = "0.14"
rand = "0.8"
rand_chacha = "0.3"
hex = "0.4"
base64 = "0.22"
serde_json = "1"
[workspace]

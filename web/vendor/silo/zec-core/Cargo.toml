[package]
name = "silo-zec-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Grain Silo ZEC core: upstream librustzcash wallet store (zcash_client_sqlite) bound for the browser"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zcash_client_sqlite = { path = "vendor/zcash_client_sqlite", default-features = false, features = ["orchard"] }
zcash_client_backend = { version = "=0.25.0-pre.1", default-features = false, features = ["orchard", "sync", "lightwalletd-tonic"] }
tonic-web-wasm-client = "0.9.2"
tonic = { version = "0.14", default-features = false }
async-trait = "0.1"
wasm-bindgen-futures = "0.4"
serde_json = "1"
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"] }
zcash_keys = { version = "=0.17.0-pre.1", default-features = false, features = ["orchard", "sapling"] }
zcash_protocol = { version = "=0.11.0-pre.0", default-features = false }
zcash_address = "=0.14.0-pre.1"
zcash_primitives = { version = "=0.31.0-pre.1", default-features = false }
zip32 = { version = "0.3", default-features = false }
orchard = { version = "0.16", default-features = false }
sapling = { package = "sapling-crypto", version = "0.9", default-features = false }
jubjub = "0.11"
bls12_381 = "0.9"
rusqlite = { version = "0.40", default-features = false, features = ["serialize", "array"] }
secrecy = "0.8"
bip0039 = { version = "0.12", default-features = false, features = ["std"] }
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }
prost = "0.14"
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

# vendor/ is prepared by scripts/silo/build-zec-core.sh from checksum-pinned crates.io sources and patches/.
[patch.crates-io]
schemerz-rusqlite = { path = "vendor/schemerz-rusqlite" }

[dependencies.getrandom_04]
package = "getrandom"
version = "0.4"
features = ["wasm_js"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[workspace]


[dev-dependencies]
base64 = "0.22"
zcash_pool_migration = { version = "=0.2.0-pre.1", default-features = false, features = ["wallet"] }
incrementalmerkletree = { version = "0.9", features = ["legacy-api"] }
hex = "0.4"

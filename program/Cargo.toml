[package]
name = "xmr-sol-swap"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Feasibility prototype: trustless XMR<->SOL atomic swap escrow (devnet only, not audited)"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "xmr_sol_swap"

[features]
default = []
no-entrypoint = []
cpi = ["no-entrypoint"]
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "=0.31.1" }
solana-curve25519 = "=2.2.7"

[dev-dependencies]
solana-program-test = "=2.2.7"
solana-sdk = "=2.2.2"
tokio = { version = "1", features = ["macros"] }
curve25519-dalek = "=4.1.3"

[workspace]
